name: Auto-Merge on CI Pass

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
  pull_request:
    types: [closed]

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  policy-gate:
    name: Policy-gated auto-merge
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' }}
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      REPO: ${{ github.repository }}
      RUN_ID: ${{ github.event.workflow_run.id }}
    steps:
      - name: Check gates and enable auto-merge
        run: |
          # Get PR number from the workflow run
          PR=$(gh api "repos/$REPO/actions/runs/$RUN_ID" \
            --jq '.pull_requests[0].number // empty' 2>/dev/null)

          if [ -z "$PR" ]; then
            echo "No PR associated with this run — skipping"
            exit 0
          fi

          echo "Checking gates for PR #$PR..."

          # Get PR body
          PR_BODY=$(gh pr view "$PR" --repo "$REPO" --json body --jq '.body')

          # Gate 1: PR body must contain Closes #N
          if ! echo "$PR_BODY" | grep -qiE "closes?\s+#[0-9]+"; then
            echo "SKIP: PR #$PR has no 'Closes #N' — auto-merge not enabled"
            exit 0
          fi

          # Extract issue number
          ISSUE=$(echo "$PR_BODY" | grep -ioE "closes?\s+#[0-9]+" | grep -oE "[0-9]+" | head -1)
          echo "  Linked issue: #$ISSUE"

          # Get issue body
          ISSUE_BODY=$(gh issue view "$ISSUE" --repo "$REPO" --json body --jq '.body')

          # Gate 2: issue must have Auto-merge allowed: yes
          if ! echo "$ISSUE_BODY" | grep -qiE "\*\*Auto-merge allowed:\*\*\s*yes"; then
            echo "SKIP: Issue #$ISSUE does not have 'Auto-merge allowed: yes'"
            exit 0
          fi

          # Gate 3: issue must NOT have Risk level: HIGH
          if echo "$ISSUE_BODY" | grep -qiE "\*\*Risk level:\*\*\s*HIGH"; then
            echo "SKIP: Issue #$ISSUE has Risk level: HIGH — manual review required"
            exit 0
          fi

          # All gates passed — enable auto-merge
          echo "All gates passed — enabling auto-merge (squash) for PR #$PR"
          gh pr merge "$PR" \
            --repo "$REPO" \
            --auto \
            --squash

  close-linked-issue:
    name: Close linked issue on merge
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'pull_request' && github.event.pull_request.merged == true }}
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      REPO: ${{ github.repository }}
      PR: ${{ github.event.pull_request.number }}
    steps:
      - name: Explicitly close the linked issue
        run: |
          # GitHub's implicit "Closes #N" auto-close-on-merge is unreliable for
          # PRs merged via `gh pr merge --auto` under GITHUB_TOKEN, even with
          # issues: write granted (confirmed empirically: a throwaway PR with
          # "Closes #N" in its body merged cleanly via auto-merge but left the
          # issue open, while the same merge performed by a full-scope PAT
          # closed it instantly). Rather than depend on that platform behavior,
          # close explicitly here, triggered by the PR actually merging,
          # regardless of who/what performed the merge.
          PR_BODY=$(gh pr view "$PR" --repo "$REPO" --json body --jq '.body')
          ISSUE=$(echo "$PR_BODY" | grep -ioE "closes?\s+#[0-9]+" | grep -oE "[0-9]+" | head -1)

          if [ -z "$ISSUE" ]; then
            echo "No 'Closes #N' in PR #$PR body — nothing to close"
            exit 0
          fi

          STATE=$(gh issue view "$ISSUE" --repo "$REPO" --json state --jq '.state' 2>/dev/null)
          if [ "$STATE" = "CLOSED" ]; then
            echo "Issue #$ISSUE already closed — nothing to do"
            exit 0
          fi

          echo "Explicitly closing issue #$ISSUE (linked PR #$PR merged)"
          gh issue close "$ISSUE" --repo "$REPO" \
            --comment "Closed automatically: linked PR #$PR merged (https://github.com/$REPO/pull/$PR)."
